<!doctype html>

<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#0e1014" />
		<meta
			name="description"
			content="A browser-based code editor and live preview."
		/>
		<title>CodePro — Docked Code Editor</title>
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<script>
			globalThis.tailwind = globalThis.tailwind || {};
			globalThis.tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						colors: {
							success: "#22C55E",
							error: "#EF4444",
							warning: "#F59E0B",
							"on-warning": "#1A1204",
							"on-error": "#1C1C1C",
							"dark-primary-container": "#1E1B4B",
							"light-on-primary-container": "#312E81",
							"light-primary": "#4F46E5",
							"light-primary-container": "#EEF2FF",
							"light-on-primary": "#FFFFFF",
							"light-on-surface": "#14171D",
							"light-on-surface-variant": "#4B5563",
							"light-surface": "#F4F5F7",
							"light-surface-container-low": "#FFFFFF",
							"light-surface-container": "#F9FAFB",
							"light-surface-container-high": "#EFF1F5",
							"light-outline": "#E2E5EB",
							"light-outline-variant": "#CBD2DC",
							"dark-primary": "#4F46E5",
							"dark-on-primary": "#FFFFFF",
							"dark-on-primary-container": "#C7D2FE",
							"dark-on-surface": "#E6E8EE",
							"dark-on-surface-variant": "#9BA3B4",
							"dark-surface": "#0E1014",
							"dark-surface-container-low": "#14171D",
							"dark-surface-container": "#1B1F27",
							"dark-surface-container-high": "#232833",
							"dark-outline": "#262B36",
							"dark-outline-variant": "#343B49",
							"on-success": "#0B140E",
						},
						spacing: {
							"gutter-xs": "4px",
							"gutter-sm": "8px",
							"gutter-md": "12px",
							"gutter-lg": "16px",
							"gutter-xl": "24px",
						},
						fontFamily: {
							headline: ["Inter", "sans-serif"],
							title: ["Inter", "sans-serif"],
							body: ["Inter", "sans-serif"],
							label: ["Inter", "sans-serif"],
							code: ["JetBrains Mono", "monospace"],
						},
						fontSize: {
							"headline-sm": [
								"16px",
								{
									lineHeight: "24px",
									letterSpacing: "-0.2px",
									fontWeight: "600",
								},
							],
							"title-md": [
								"14px",
								{
									lineHeight: "20px",
									letterSpacing: "-0.1px",
									fontWeight: "600",
								},
							],
							"title-sm": [
								"13px",
								{ lineHeight: "18px", letterSpacing: "0px", fontWeight: "600" },
							],
							"body-lg": [
								"14px",
								{ lineHeight: "20px", letterSpacing: "0px", fontWeight: "400" },
							],
							"body-md": [
								"13px",
								{ lineHeight: "18px", letterSpacing: "0px", fontWeight: "400" },
							],
							"label-lg": [
								"13px",
								{ lineHeight: "18px", letterSpacing: "0px", fontWeight: "500" },
							],
							"label-md": [
								"12px",
								{
									lineHeight: "16px",
									letterSpacing: "0.1px",
									fontWeight: "500",
								},
							],
							"label-sm": [
								"11px",
								{
									lineHeight: "14px",
									letterSpacing: "0.2px",
									fontWeight: "500",
								},
							],
							"code-md": [
								"13px",
								{ lineHeight: "20px", letterSpacing: "0px", fontWeight: "400" },
							],
							"code-sm": [
								"12px",
								{ lineHeight: "18px", letterSpacing: "0px", fontWeight: "400" },
							],
						},
						borderRadius: {
							sm: "4px",
							DEFAULT: "6px",
							md: "8px",
							lg: "12px",
							full: "9999px",
						},
						transitionDuration: {
							"state-change": "120ms",
							"surface-enter": "160ms",
						},
					},
				},
			};
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body
		class="bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface font-body antialiased selection:bg-light-primary-container dark:selection:bg-dark-primary-container"
	>
		<div id="root"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
